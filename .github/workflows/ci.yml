name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native checks: formatting, clippy, host-crate tests, WIT validation.
  # No wasm execution; needs wasm-tools only (wit-check).
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        # Pinned by rust-toolchain.toml (channel, wasm target, rustfmt,
        # clippy); `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-checks
          cache-all-crates: true

      - name: Install tools
        run: ./scripts/setup.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Host checks
        run: just gha::host-checks

  # The full verification matrix: component builds, all execution
  # paths (host-embed runner, composed wasi:cli runner under wasmtime,
  # deltic runner under stock Deno + its selftest under plain Node,
  # inventory + results pipeline), lockfile drift checks. No engine
  # flags: the jco/JSPI lane was deleted in the deltic migration.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          cache-all-crates: true

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Install tools
        run: ./scripts/setup.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verification matrix
        # Includes the fixture pipeline's JUnit demo artifacts (the #11
        # demo): the following steps render them into the job summary.
        # The fixture's deliberate trap appears as a real failure row;
        # fail_on_failure stays off - the gate is `just all` inside
        # gha::verify, and the fixture is *supposed* to fail.
        run: just gha::verify

      - name: Aggregate the demo results into the job summary
        # Dogfoods actions/aggregate (the #14 composite action): the
        # matrix lands in the job summary and validation findings
        # become annotations; the exit code is the CLI's own gate. The
        # fixture's deliberate trap is declared expected-fail in the
        # example manifest, so this is green with the debt reported.
        uses: ./actions/aggregate
        with:
          lock: target/tests.lock
          manifest: examples/aggregate/targets.toml
          results: |
            native=target/native.jsonl
            sim=target/sim.jsonl
          summary-title: Fixture pipeline matrix (actions/aggregate demo)
          cli: target/debug/component-test

      - name: Render the test report into the job summary
        # annotate_only: the fixture pipeline *deliberately* fails (the
        # trap case), so a check run would put a red X on every green
        # commit; the job summary is the demo surface.
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/junit-demo.xml
          detailed_summary: true
          include_passed: true
          fail_on_failure: false
          require_tests: true
          annotate_only: true

  # Dogfoods actions/setup (the #56 consumer bootstrap): a synthetic
  # consumer Cargo.lock pins this very commit, the action installs the
  # tools from the checkout (source-path), and its pins gate must hold
  # the fixture to that rev. Asserts the advertised outputs and bin
  # names on top.
  actions-setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: actions-setup-smoke
          cache-all-crates: true

      - name: Synthesize a consumer Cargo.lock pinned to this commit
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/Cargo.lock" <<EOF
          version = 4

          [[package]]
          name = "component-test-sdk"
          version = "0.1.0"
          source = "git+https://github.com/polymorph-components/polymorph-test?rev=${{ github.sha }}#${{ github.sha }}"
          EOF

      - name: Run the setup action from source
        id: setup
        uses: ./actions/setup
        with:
          cargo-lock: ${{ runner.temp }}/consumer/Cargo.lock
          install-root: ${{ runner.temp }}/consumer/ct-tools
          source-path: .

      - name: Assert outputs and binaries
        run: |
          test "${{ steps.setup.outputs.rev }}" = "${{ github.sha }}"
          test -x "${{ steps.setup.outputs.bin }}/component-test"
          test -x "${{ steps.setup.outputs.bin }}/ct-runner"
