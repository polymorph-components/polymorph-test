name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native checks: formatting, clippy, host-crate tests, WIT validation.
  # No wasm execution; needs wasm-tools only (wit-check).
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        # Pinned by rust-toolchain.toml (channel, wasm target, rustfmt,
        # clippy); `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-checks
          cache-all-crates: true

      - name: Install tools
        run: ./scripts/setup.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Host checks
        run: just host-checks

  # The full verification matrix: component builds, all four execution
  # paths (host-embed runner, composed wasi:cli runner under wasmtime,
  # jco runner under Node/JSPI, inventory + results pipeline), lockfile
  # drift checks.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          cache-all-crates: true

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tools
        run: ./scripts/setup.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verification matrix
        run: just all

      # The #11 demo: the fixture pipeline's results, converted by
      # `component-test emit junit`, rendered into the run's job summary
      # by an off-the-shelf reporter. The fixture's deliberate trap
      # appears as a real failure row; fail_on_failure stays off - the
      # gate is `just all` above, and the fixture is *supposed* to fail.
      - name: Emit JUnit (demo)
        run: just emit-demo

      - name: Render the test report into the job summary
        # annotate_only: the fixture pipeline *deliberately* fails (the
        # trap case), so a check run would put a red X on every green
        # commit; the job summary is the demo surface.
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/junit-demo.xml
          detailed_summary: true
          include_passed: true
          fail_on_failure: false
          require_tests: true
          annotate_only: true
