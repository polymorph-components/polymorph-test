[package]
name = "sample-suite"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Suites need only the SDK: it owns the contract bindings. A suite
# that imports a system-under-test adds its own wit-bindgen +
# `wit_bindgen::generate!` for that surface only.
component-test-sdk = { workspace = true }
