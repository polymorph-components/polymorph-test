[package]
name = "bench-suite"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
component-test-sdk = { workspace = true }
wit-bindgen = { workspace = true, optional = true }

[features]
# Adds a bare `wizer-initialize` world export that forces the registry
# build, for `wasmtime wizer` pre-initialization experiments (#25).
wizer-init = ["dep:wit-bindgen"]
