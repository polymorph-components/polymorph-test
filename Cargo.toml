[workspace]
resolver = "2"
members = [
    "crates/component-test-core",
    "crates/component-test-formats",
    "crates/component-test-results",
    "crates/component-test-sdk",
    "crates/component-test-sdk-macro",
    "crates/component-test-cli",
    "crates/component-test-runner",
    "components/bench-suite",
    "components/drift-fixture",
    "components/fixture-suite",
    "components/hang-fixture",
    "components/provider",
    "components/runner-cli",
    "components/sample-suite",
    "components/viewer-aggregate",
    "components/zero-gen-fixture",
]
# Host-side crates only: `components/*` build for wasm32-wasip2 and a
# native `cargo test` on them proves nothing even where it compiles.
# Bare `cargo test` / `cargo clippy` therefore cover exactly the crates
# the CI host job checks — no exclusion lists to keep in sync.
default-members = [
    "crates/component-test-core",
    "crates/component-test-formats",
    "crates/component-test-results",
    "crates/component-test-sdk",
    "crates/component-test-sdk-macro",
    "crates/component-test-cli",
    "crates/component-test-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/polymorph-components/polymorph-test"

[workspace.dependencies]
component-test-core = { path = "crates/component-test-core" }
component-test-formats = { path = "crates/component-test-formats" }
component-test-results = { path = "crates/component-test-results" }
component-test-sdk = { path = "crates/component-test-sdk" }
component-test-sdk-macro = { path = "crates/component-test-sdk-macro" }
wit-bindgen = "0.60"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", default-features = false }
anyhow = "1"
trybuild = "1"

[profile.release]
opt-level = "s"
strip = true
