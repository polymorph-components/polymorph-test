[workspace]
resolver = "2"
members = [
    "crates/component-test-core",
    "crates/component-test-formats",
    "crates/component-test-sdk",
    "prototype/provider",
    "prototype/suite",
    "prototype/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/lann/component-test"

[workspace.dependencies]
component-test-core = { path = "crates/component-test-core" }
component-test-formats = { path = "crates/component-test-formats" }
component-test-sdk = { path = "crates/component-test-sdk" }
wit-bindgen = "0.60"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"

[profile.release]
opt-level = "s"
strip = true
