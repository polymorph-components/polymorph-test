[package]
name = "component-test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
component-test-core = { workspace = true }
component-test-formats = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
# Timers only: the case-timeout races the run future against a sleep
# on the wasmtime-wasi runtime (which powers wasi clock pollables, so
# time is enabled there).
tokio = { workspace = true, features = ["time"] }
wasmtime = { version = "47", features = ["component-model-async"] }
wasmtime-wasi = "47"

[[bin]]
name = "ct-runner"
path = "src/bin/ct-runner.rs"

[[bin]]
name = "bench-mint"
path = "src/bin/bench-mint.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
